<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الأعضاء | الاستعلام عن النقاط</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        body { font-family: 'Tajawal', sans-serif; }
        .bg-primary { background-color: #800000; }
        .text-primary { color: #800000; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border-t-4 border-red-800">
        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold text-primary mb-2">بوابة أعضاء النادي</h2>
            <p class="text-gray-500 text-sm">أدخل رقمك الجامعي لمعرفة رصيد نقاطك الحالي</p>
        </div>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">الرقم الجامعي:</label>
                <input type="text" id="student-id" class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-red-800 focus:border-transparent transition" placeholder="أدخل رقمك هنا...">
            </div>
            <button onclick="checkPoints()" class="w-full bg-primary text-white font-bold py-3 px-4 rounded-lg hover:bg-red-900 transition shadow-lg">
                عرض النقاط
            </button>
        </div>

        <!-- صندوق النتيجة (مخفي افتراضياً) -->
        <div id="result-container" class="mt-8 hidden text-center p-6 rounded-xl bg-gray-50 border border-gray-200">
            <h3 id="res-name" class="font-bold text-xl text-gray-800 mb-2"></h3>
            <p class="text-gray-500 text-sm mb-2">رصيد نقاطك المعتمد هو:</p>
            <div id="res-points" class="text-4xl font-extrabold text-green-600 mt-2" dir="ltr"></div>
        </div>
        
        <!-- صندوق رسالة الخطأ (مخفي افتراضياً) -->
        <div id="error-msg" class="mt-6 hidden text-center text-red-600 font-bold text-sm bg-red-50 p-3 rounded-lg border border-red-100">
            الرقم الجامعي غير مسجل، أو لم يتم رصد نقاط لك بعد.
        </div>
        
        <div class="mt-6 text-center">
            <a href="/" class="text-sm text-gray-400 hover:text-primary transition">العودة للصفحة الرئيسية</a>
        </div>
    </div>

    <script>
        function checkPoints() {
            const inputId = document.getElementById('student-id').value.trim();
            const resultBox = document.getElementById('result-container');
            const errorBox = document.getElementById('error-msg');
            const resName = document.getElementById('res-name');
            const resPoints = document.getElementById('res-points');

            // إخفاء أي نتائج سابقة وقت البحث
            resultBox.classList.add('hidden');
            errorBox.classList.add('hidden');

            if(!inputId) return;

            // جلب ملف النقاط اللي تعبيه من لوحة التحكم
            fetch('/data/points.json')
                .then(res => res.json())
                .then(data => {
                    if(data.points && data.points.list) {
                        // البحث عن العضو برقم الـ ID
                        const member = data.points.list.find(m => String(m.id).trim() === inputId);
                        if(member) {
                            resName.textContent = "أهلاً بك، " + member.name;
                            resPoints.textContent = member.points + " ⭐️";
                            resultBox.classList.remove('hidden');
                        } else {
                            errorBox.classList.remove('hidden');
                        }
                    } else {
                        errorBox.classList.remove('hidden');
                    }
                })
                .catch(() => {
                    errorBox.textContent = "حدث خطأ في النظام، يرجى المحاولة لاحقاً.";
                    errorBox.classList.remove('hidden');
                });
        }
    </script>
</body>
</html>
