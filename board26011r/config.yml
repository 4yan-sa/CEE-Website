backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

locale: "ar"

collections:
  # القسم الأول: الفعاليات
  - name: "events"
    label: "الفعاليات"
    folder: "events"
    create: true
    fields:
      - {label: "عنوان الفعالية", name: "title", widget: "string"}
      - {label: "التاريخ", name: "date", widget: "datetime"}
      - {label: "رابط التسجيل", name: "registration_link", widget: "string", required: false}
      - {label: "وصف الفعالية", name: "body", widget: "markdown"}

  # القسم الثاني (اللي كان مسبب المشكلة وتم إصلاحه بإضافة سطر folder): أعضاء النادي
  - name: "team"
    label: "أعضاء النادي"
    folder: "team" 
    create: true
    fields:
      - {label: "الاسم", name: "name", widget: "string"}
      - {label: "المنصب", name: "role", widget: "string"}