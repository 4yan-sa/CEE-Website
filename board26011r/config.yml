backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

locale: "ar"

collections:
  - name: "site_data"
    label: "إدارة محتوى الموقع"
    files:
      - label: "الفعاليات"
        name: "events"
        file: "data/events.json"
        fields:
          - label: "قائمة الفعاليات"
            name: "event_list"
            widget: "list"
            fields:
              - {label: "عنوان الفعالية", name: "title", widget: "string"}
              - {label: "التاريخ", name: "date", widget: "datetime"}
              - {label: "رابط التسجيل", name: "link", widget: "string", required: false}
              - {label: "وصف الفعالية", name: "body", widget: "text"}
              
      - label: "نقاط الأعضاء"
        name: "points"
        file: "data/points.json"
        fields:
          - label: "جدول النقاط"
            name: "points_list"
            widget: "list"
            fields:
              - {label: "اسم العضو", name: "member_name", widget: "string"}
              - {label: "مجموع النقاط", name: "total_points", widget: "number"}

      - label: "الإعدادات والروابط"
        name: "settings"
        file: "data/settings.json"
        fields:
          - {label: "رابط انضم إلينا", name: "join_link", widget: "string"}
