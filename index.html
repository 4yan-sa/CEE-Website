<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نادي الهندسة المدنية والبيئية | CEE Club</title>
    <!-- استدعاء Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        body { font-family: 'Tajawal', sans-serif; }
        .bg-primary { background-color: #800000; } /* لون عنابي رسمي */
        .text-primary { color: #800000; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- القائمة العلوية -->
    <nav class="bg-primary text-white shadow-lg relative z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- شعار النادي -->
                <div class="flex items-center">
                    <span class="font-bold text-xl">CEE Club</span>
                </div>
                <!-- زر الجوال (الثلاث شرطات) -->
                <div class="-mr-2 flex md:hidden">
                    <button type="button" onclick="toggleMenu()" class="inline-flex items-center justify-center p-2 rounded-md hover:bg-red-900 focus:outline-none">
                        <svg class="h-6 w-6" stroke="currentColor" fill="none" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                </div>
                <!-- روابط الكمبيوتر -->
                <div class="hidden md:flex items-center space-x-4 space-x-reverse">
                    <a href="#" class="px-3 py-2 rounded-md font-medium hover:bg-red-900 transition">الرئيسية</a>
                    <a href="#events" class="px-3 py-2 rounded-md font-medium hover:bg-red-900 transition">الفعاليات</a>
                    <a href="#points" class="px-3 py-2 rounded-md font-medium hover:bg-red-900 transition">النقاط</a>
                    <a href="#" id="join-btn" class="bg-white text-primary px-4 py-2 rounded-md font-bold mr-4 hover:bg-gray-100 transition">انضم إلينا</a>
                </div>
            </div>
        </div>
        <!-- قائمة الجوال المنسدلة -->
        <div class="hidden md:hidden absolute w-full bg-primary shadow-xl border-t border-red-800" id="mobile-menu">
            <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
                <a href="#" class="block px-3 py-2 rounded-md text-base font-medium hover:bg-red-900">الرئيسية</a>
                <a href="#events" class="block px-3 py-2 rounded-md text-base font-medium hover:bg-red-900">الفعاليات</a>
                <a href="#points" class="block px-3 py-2 rounded-md text-base font-medium hover:bg-red-900">النقاط</a>
                <a href="#" id="join-btn-mobile" class="block px-3 py-2 rounded-md text-base font-bold bg-white text-primary mt-2 text-center">انضم إلينا</a>
            </div>
        </div>
    </nav>

    <!-- قسم الفعاليات القادمة -->
    <div id="events" class="py-12 bg-white">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <h2 class="text-3xl font-extrabold text-center mb-10 text-primary">الفعاليات القادمة</h2>
            <div id="events-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- الفعاليات تظهر هنا -->
            </div>
        </div>
    </div>

    <!-- قسم لوحة الشرف والنقاط -->
    <div id="points" class="py-12 bg-gray-50">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <h2 class="text-3xl font-extrabold text-center mb-10 text-primary">لوحة شرف الأعضاء</h2>
            <div class="bg-white shadow overflow-hidden rounded-lg border">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="px-6 py-4 text-right text-sm font-bold text-gray-700">اسم العضو</th>
                            <th class="px-6 py-4 text-left text-sm font-bold text-gray-700">مجموع النقاط</th>
                        </tr>
                    </thead>
                    <tbody id="points-container" class="divide-y divide-gray-200">
                        <!-- النقاط تظهر هنا -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- أكواد الجافاسكريبت لجلب البيانات وتفعيل التصميم -->
    <script>
        // دالة فتح وإغلاق قائمة الجوال
        function toggleMenu() {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        }

        // 1. جلب الإعدادات (رابط انضم إلينا)
        fetch('/data/settings.json')
            .then(res => res.json())
            .then(data => {
                if(data.settings && data.settings.join_link) {
                    document.getElementById('join-btn').href = data.settings.join_link;
                    document.getElementById('join-btn-mobile').href = data.settings.join_link;
                }
            }).catch(() => console.log('بانتظار إضافة الإعدادات'));

        // 2. جلب الفعاليات
        fetch('/data/events.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('events-container');
                if (data.events && data.events.event_list && data.events.event_list.length > 0) {
                    data.events.event_list.forEach(event => {
                        const dateStr = new Date(event.date).toLocaleDateString('ar-SA');
                        container.innerHTML += `
                            <div class="bg-white border rounded-xl shadow-sm hover:shadow-lg transition duration-300 p-6 flex flex-col">
                                <h3 class="text-xl font-bold mb-2 text-gray-900">${event.title}</h3>
                                <p class="text-sm font-semibold text-red-600 mb-4">📅 ${dateStr}</p>
                                <p class="text-gray-600 mb-6 flex-grow">${event.body}</p>
                                ${event.link ? `<a href="${event.link}" target="_blank" class="bg-primary text-white text-center py-2 rounded-lg font-bold hover:bg-red-900 transition">التسجيل في الفعالية</a>` : ''}
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = '<p class="text-center col-span-full text-gray-500">لا توجد فعاليات مجدولة حالياً.</p>';
                }
            }).catch(() => {
                document.getElementById('events-container').innerHTML = '<p class="text-center col-span-full text-gray-500">لم يتم إضافة فعاليات بعد.</p>';
            });

        // 3. جلب النقاط وترتيبها
        fetch('/data/points.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('points-container');
                if (data.points && data.points.points_list && data.points.points_list.length > 0) {
                    // ترتيب الأعضاء من الأعلى للأقل نقاط
                    const sorted = data.points.points_list.sort((a,b) => b.total_points - a.total_points);
                    sorted.forEach(member => {
                        container.innerHTML += `
                            <tr class="hover:bg-gray-50 transition">
                                <td class="px-6 py-4 whitespace-nowrap text-md font-medium text-gray-900">${member.member_name}</td>
                                <td class="px-6 py-4 whitespace-nowrap text-left font-bold text-green-600 text-lg" dir="ltr">${member.total_points} ⭐️</td>
                            </tr>
                        `;
                    });
                } else {
                    container.innerHTML = '<tr><td colspan="2" class="px-6 py-4 text-center text-gray-500">لا توجد نقاط مسجلة بعد.</td></tr>';
                }
            }).catch(() => console.log('بانتظار إضافة النقاط'));
    </script>

    <!-- سكريبت الدخول الخاص بـ Netlify (الباب السري) -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", user => {
                if (!user) {
                    window.netlifyIdentity.on("login", () => {
                        document.location.href = "/board26011r/";
                    });
                }
            });
        }
    </script>
</body>
</html>
